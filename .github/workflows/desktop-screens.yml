name: Desktop tunnel repro
on:
  push:
    branches: [claude/desktop-screens]
permissions:
  contents: read
jobs:
  repro:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Repro
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          git --version
          $ssh = Join-Path $env:USERPROFILE '.ssh'
          New-Item -ItemType Directory -Force $ssh | Out-Null
          & ssh-keygen.exe -q -t ed25519 -N '""' -f "$ssh\id_ed25519"
          $auth = 'C:\ProgramData\ssh\administrators_authorized_keys'
          if (-not (Get-Service sshd -ErrorAction SilentlyContinue)) { Add-WindowsCapability -Online -Name OpenSSH.Server~~~~0.0.1.0 | Out-Null }
          Start-Service sshd
          Copy-Item "$ssh\id_ed25519.pub" $auth -Force
          icacls $auth /inheritance:r /grant 'Administrators:F' /grant 'SYSTEM:F' | Out-Null
          Restart-Service sshd
          $pg = 'https://github.com/git-for-windows/git/releases/download/v2.55.0.windows.3/PortableGit-2.55.0.3-64-bit.7z.exe'
          try { Invoke-WebRequest $pg -OutFile "$env:RUNNER_TEMP\pg.exe"; & "$env:RUNNER_TEMP\pg.exe" -o"C:\pg" -y | Out-Null; Start-Sleep 5 } catch { Write-Host "portable git download failed: $_" }
          python tools\screens\tunnel_repro.py 'C:\Windows\System32\OpenSSH\ssh.exe' 'C:\Program Files\Git\usr\bin\ssh.exe' 'C:\pg\usr\bin\ssh.exe'
