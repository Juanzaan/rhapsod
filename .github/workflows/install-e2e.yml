name: Install E2E

# Runs install.sh on a fresh runner the way a new owner would on a clean
# VPS, against a real TeamSpeak server in a container (3, and the official
# 6 beta), then checks that the bot joined, the panel answers and
# `rhapsod doctor` reports no failure.
on:
  pull_request:
    branches: [main]
    paths:
      - install.sh
      - scripts/**
      - deploy/**
      - .github/workflows/install-e2e.yml
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# -o pipefail: the install is piped through tee and must still fail the step.
defaults:
  run:
    shell: bash

concurrency:
  group: install-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-22.04, server: ts3 }
          - { runner: ubuntu-24.04, server: ts3 }
          - { runner: ubuntu-24.04-arm, server: ts3 }
          # Install and join only: update, rollback and uninstall do not
          # depend on the server.
          - { runner: ubuntu-24.04, server: ts6 }
    name: install (${{ matrix.runner }}, ${{ matrix.server }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The TeamSpeak 3 server is published for amd64 only; arm64 runs it
      # under emulation, which is slower but speaks the same protocol.
      - if: matrix.server == 'ts3' && runner.arch == 'ARM64'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: amd64
      - name: Start a TeamSpeak 3 server
        if: matrix.server == 'ts3'
        run: |
          docker run -d --name ts --network host --platform linux/amd64 \
            -e TS3SERVER_LICENSE=accept teamspeak:3.13
          for _ in $(seq 1 90); do
            if (: </dev/tcp/127.0.0.1/10011) 2>/dev/null; then exit 0; fi
            sleep 2
          done
          docker logs ts
          exit 1
      # TeamSpeak 6 keeps the TeamSpeak 3 client protocol on UDP 9987; the
      # file transfer port (TCP) says it finished starting.
      - name: Start a TeamSpeak 6 server
        if: matrix.server == 'ts6'
        run: |
          docker run -d --name ts --network host \
            -e TSSERVER_LICENSE_ACCEPTED=accept teamspeaksystems/teamspeak6-server:6.0.0-beta13.1
          for _ in $(seq 1 90); do
            if (: </dev/tcp/127.0.0.1/30033) 2>/dev/null; then exit 0; fi
            sleep 2
          done
          docker logs ts
          exit 1

      # Runner images ship Node 20 in /usr/local/bin; a clean VPS has none,
      # so the installer's own Node 22 download is what gets tested. The
      # checkout is copied where the service user can read it.
      - name: Make the runner look like a clean server
        run: |
          sudo rm -f /usr/local/bin/node /usr/local/bin/npm /usr/local/bin/npx /usr/local/bin/corepack
          git branch -f e2e HEAD
          sudo cp -a "$GITHUB_WORKSPACE" /opt/rhapsod-src
          sudo chmod -R a+rX /opt/rhapsod-src
          sudo git config --system --add safe.directory '*'
          # Later steps commit new "releases" on e2e for update and rollback.
          sudo git -C /opt/rhapsod-src checkout -q e2e
          # Five minutes: under QEMU a TeamSpeak handshake can stall until the
          # bot's own connect timeout (180 s) and systemd's restart retry it.
          cat > "$RUNNER_TEMP/wait-connected" <<'SH'
          for _ in $(seq 1 100); do
            rhapsod status 2>/dev/null | grep -q 'TeamSpeak:  connected' && exit 0
            sleep 3
          done
          rhapsod status
          exit 1
          SH

      - name: Install
        run: |
          start="$(date +%s)"
          sudo env RHAPSOD_REPOSITORY=/opt/rhapsod-src RHAPSOD_REF=e2e \
            RHAPSOD_TS3_HOST=127.0.0.1 bash install.sh </dev/null 2>&1 | tee install.log
          elapsed="$(( $(date +%s) - start ))"
          echo "Install on ${{ matrix.runner }}: ${elapsed}s" >> "$GITHUB_STEP_SUMMARY"

      - name: Check the bot
        run: |
          grep -q 'The bot is in your TeamSpeak server.' install.log
          grep -Eq '!claim [a-z0-9]{5}-[a-z0-9]{5}' install.log
          # The installer returns once the bot joined; the panel may still be
          # a moment away from listening.
          bash "$RUNNER_TEMP/wait-connected"
          rhapsod doctor

      # A rerun must keep the install working and not ask anything again.
      - name: Rerun the installer
        if: matrix.server == 'ts3'
        run: |
          sudo env RHAPSOD_REPOSITORY=/opt/rhapsod-src RHAPSOD_REF=e2e \
            bash install.sh </dev/null 2>&1 | tee rerun.log
          grep -q '(existing password preserved)' rerun.log
          bash "$RUNNER_TEMP/wait-connected"
          rhapsod doctor

      - name: Back up
        if: matrix.server == 'ts3'
        run: |
          sudo rhapsod backup | tee backup.txt
          file="$(sed -n 's/^Backup: //p' backup.txt)"
          sudo tar -tzf "$file" > backup-list.txt
          grep -qx '.env' backup-list.txt
          grep -q '^data/' backup-list.txt
          bash "$RUNNER_TEMP/wait-connected"

      - name: Update to a new version
        if: matrix.server == 'ts3'
        run: |
          sudo -u rhapsod git -C /home/rhapsod/rhapsod rev-parse HEAD > installed.sha
          sudo git -C /opt/rhapsod-src -c user.name=e2e -c user.email=e2e@localhost \
            commit -q --allow-empty -m "e2e: next version"
          git -C /opt/rhapsod-src rev-parse HEAD > updated.sha
          sudo rhapsod update --ref e2e
          test "$(sudo -u rhapsod git -C /home/rhapsod/rhapsod rev-parse HEAD)" = "$(cat updated.sha)"
          bash "$RUNNER_TEMP/wait-connected"

      # A version that crashes on start must be rolled back by the update.
      - name: Update to a broken version
        if: matrix.server == 'ts3'
        run: |
          sudo sed -i '1i process.exit(1);' /opt/rhapsod-src/src/main.ts
          sudo git -C /opt/rhapsod-src -c user.name=e2e -c user.email=e2e@localhost \
            commit -q -a -m "e2e: version that crashes"
          if sudo rhapsod update --ref e2e; then
            echo "the broken update was not rolled back"
            exit 1
          fi
          test "$(sudo -u rhapsod git -C /home/rhapsod/rhapsod rev-parse HEAD)" = "$(cat updated.sha)"
          bash "$RUNNER_TEMP/wait-connected"

      - name: Roll back
        if: matrix.server == 'ts3'
        run: |
          sudo rhapsod rollback
          test "$(sudo -u rhapsod git -C /home/rhapsod/rhapsod rev-parse HEAD)" = "$(cat installed.sha)"
          bash "$RUNNER_TEMP/wait-connected"

      - name: Uninstall
        if: matrix.server == 'ts3'
        run: |
          sudo rhapsod uninstall --purge --yes
          if id rhapsod 2>/dev/null; then echo "user left behind"; exit 1; fi
          if [[ -e /home/rhapsod || -e /usr/local/bin/rhapsod || -e /etc/rhapsod ]]; then
            echo "files left behind"
            exit 1
          fi
          if systemctl cat rhapsod >/dev/null 2>&1; then echo "unit left behind"; exit 1; fi
          sudo ls /var/backups/rhapsod/ | grep -q '^rhapsod-.*\.tar\.gz$'

      # A server that had Rhapsod before must take a new install cleanly.
      - name: Install again
        if: matrix.server == 'ts3'
        run: |
          sudo git -C /opt/rhapsod-src reset -q --hard "$(cat updated.sha)"
          sudo env RHAPSOD_REPOSITORY=/opt/rhapsod-src RHAPSOD_REF=e2e \
            RHAPSOD_TS3_HOST=127.0.0.1 bash install.sh </dev/null 2>&1 | tee reinstall.log
          grep -q 'The bot is in your TeamSpeak server.' reinstall.log
          bash "$RUNNER_TEMP/wait-connected"
          rhapsod doctor

      - name: Logs
        if: failure()
        run: |
          sudo journalctl -u rhapsod -u rhapsod-ytdlp-daemon -u bgutil-pot-provider --no-pager -n 300 || true
          docker logs ts 2>&1 | tail -50 || true
