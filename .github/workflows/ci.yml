name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets you run the gates on a branch that has no PR open yet.
  workflow_dispatch:

permissions:
  contents: read

# Successive pushes to the same ref supersede each other.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Mirrors `npm run check`, expanded so each gate reports separately and
      # the suite runs once (test:coverage supersedes the plain test step).
      - run: npm run format:check
      - run: npm run lint
      - run: npm run lint:scripts
      - run: npm run lint:docs
      - name: Validate installer syntax
        run: bash -n install.sh
      - run: npm run typecheck
      - name: Test with coverage
        run: npm run test:coverage
      - run: npm run build
      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  runtime-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: [22.19.0, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Validate Compose
        run: |
          cp .env.example .env
          docker compose config --quiet
      - run: docker build -t rhapsod:ci .
      - name: Check runtime tools
        run: |
          docker run --rm rhapsod:ci node --version
          docker run --rm rhapsod:ci yt-dlp --version
          docker run --rm rhapsod:ci python3 -c 'import yt_dlp'
          docker run --rm rhapsod:ci ffmpeg -version

  desktop:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Build the Windows launcher
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools\desktop\build.ps1
      # Non-interactive smoke run: settings from stdin, no password, a key
      # that does not exist. The launcher must save the settings and stop
      # with "SSH key not found" instead of hanging on a prompt.
      - name: Smoke-test first-run setup
        shell: pwsh
        run: |
          $output = "ci@127.0.0.1`nC:\missing-key`nadmin`n18080`n8080`n`n" | & tools\desktop\bin\RhapsodDashboard.exe
          $output
          if ($LASTEXITCODE -ne 1) { throw "expected exit code 1, got $LASTEXITCODE" }
          if (-not ($output -match 'SSH key not found')) { throw 'missing key was not reported' }
      - uses: actions/upload-artifact@v7
        with:
          name: rhapsod-dashboard
          path: tools/desktop/bin/RhapsodDashboard.exe
          retention-days: 14
