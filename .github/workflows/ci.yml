name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets you run the gates on a branch that has no PR open yet.
  workflow_dispatch:

permissions:
  contents: read

# Successive pushes to the same ref supersede each other.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Mirrors `npm run check`, expanded so each gate reports separately and
      # the suite runs once (test:coverage supersedes the plain test step).
      - run: npm run format:check
      - run: npm run lint
      - run: npm run lint:scripts
      - run: npm run lint:docs
      - name: Validate shell script syntax
        run: bash -n install.sh scripts/*.sh
      - run: npm run typecheck
      - name: Test with coverage
        run: npm run test:coverage
      - run: npm run build
      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  runtime-compatibility:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      # One platform failing should not hide the others' results.
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: 22.19.0 }
          - { os: ubuntu-latest, node: "24" }
          # arm64 hosts, such as OCI Ampere instances.
          - { os: ubuntu-24.04-arm, node: 22.19.0 }
          - { os: windows-latest, node: 22.19.0 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate Compose
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config --quiet
      - run: docker build -t rhapsod:ci .
      - name: Check runtime tools
        run: |
          docker run --rm rhapsod:ci node --version
          docker run --rm rhapsod:ci yt-dlp --version
          docker run --rm rhapsod:ci python3 -c 'import yt_dlp'
          docker run --rm rhapsod:ci ffmpeg -version
      # No env file and no settings: the image has to reach a healthy
      # panel-only start by itself, the way `docker compose up` would.
      - name: First start without an env file
        run: |
          docker run -d --name first-start --network host rhapsod:ci
          status=starting
          for _ in $(seq 1 45); do
            status="$(docker inspect -f '{{.State.Health.Status}}' first-start)"
            [ "$status" = starting ] || break
            sleep 2
          done
          docker logs first-start
          docker exec first-start node dist/cli.js status
          docker exec first-start node dist/cli.js doctor || true
          test "$status" = healthy
          docker logs first-start | grep -q 'panel login admin / '

  desktop:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the Windows launcher
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools\desktop\build.ps1
      # The app is a tray program with no console; --self-test runs its
      # non-UI checks (settings round trip, port validation, telling a
      # foreign HTTP service from the panel) and writes a report.
      - name: Self-test
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'dashboard-self-test.txt'
          $process = Start-Process -FilePath tools/desktop/bin/RhapsodDashboard.exe `
            -ArgumentList '--self-test', "`"$report`"" -Wait -PassThru
          Get-Content $report
          if ($process.ExitCode -ne 0) { throw "self-test failed with exit code $($process.ExitCode)" }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rhapsod-dashboard
          path: tools/desktop/bin/RhapsodDashboard.exe
          retention-days: 14
