name: CI

on:
  push:
    branches:
      - main
      - "next/*"
      - "feat/*"
      - "fix/*"
      - "perf/*"
      - "refactor/*"
      - "chore/*"
      - "docs/*"
      - "test/*"
  pull_request:
    branches: [main]

permissions:
  contents: read

# A branch push and its open PR would otherwise run the same commit twice.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Mirrors `npm run check`, expanded so each gate reports separately and
      # the suite runs once (test:coverage supersedes the plain test step).
      - run: npm run format:check
      - run: npm run lint
      - run: npm run lint:scripts
      - run: npm run typecheck
      - name: Test with coverage
        run: npm run test:coverage
      - run: npm run build
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7
